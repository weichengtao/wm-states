site_name: WM States
site_description: Full-session working-memory analysis with the next pipeline
repo_url: https://github.com/weichengtao/wm-states
repo_name: weichengtao/wm-states
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Overview: index.md
  - Next pipeline:
      - Getting started: next/getting-started.md
      - Configuration: next/configuration.md
      - Pipeline stages: next/pipeline.md
      - Selection and decoding: next/selection-decoding.md
      - Mixed-effects analyses: next/mixed-effects.md
      - Outputs and inspection: next/outputs.md
      - Migration: next/migration.md
      - Troubleshooting: next/troubleshooting.md
  - Validation:
      - Next pipeline: validation/next.md
  - Development: development.md
