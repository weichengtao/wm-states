{% extends "base.html" %}

{% block header %}
  {{ super() }}
  <div id="dashboard-return" hidden style="background: var(--md-code-bg-color); padding: .45rem .8rem; font-size: .7rem; text-align: center;">
    <a href="/" style="color: var(--md-primary-fg-color); font-weight: 600;">&larr; Back to dashboard</a>
    <span style="margin-left: .6rem; color: var(--md-default-fg-color--light);">Your analysis keeps running while you read.</span>
  </div>
  <script>
    // Reveal the shortcut only when this origin serves the actual dashboard.
    // Static hosting (including GitHub Pages) needs no dashboard connection.
    if (window.location.pathname.startsWith("/docs/")) {
      fetch("/api/health", {
        cache: "no-store",
        credentials: "same-origin",
        mode: "same-origin",
        redirect: "error"
      })
        .then(function (response) {
          return response.ok ? response.json() : null;
        })
        .then(function (health) {
          if (health && health.status === "ok" && health.service === "wm-states-next") {
            document.getElementById("dashboard-return").hidden = false;
          }
        })
        .catch(function () { /* A standalone guide keeps the shortcut hidden. */ });
    }
  </script>
{% endblock %}
